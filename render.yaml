# Render Blueprint
#
# Los previews se mantienen MANUALES porque la aplicación usa Supabase
# y las variables sensibles marcadas como sync: false no se copian a previews.
# Esto evita que un preview quede accidentalmente conectado a producción.
#
# Para crear un preview, configura primero en Render las variables de entorno
# necesarias para el entorno de prueba y solicita el preview desde el PR.
previews:
  generation: manual
  expireAfterDays: 3

services:
  - type: web
    name: cobijo-vzla
    env: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.1

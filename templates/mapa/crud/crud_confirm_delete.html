{% extends 'base.html' %}
{% load static %}

{% block title %}Eliminar {{ verbose_name }} - CobijoVzla{% endblock %}

{% block content %}
<div class="crud-container single">
    <main class="crud-main">
        <div class="delete-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <h1>¿Eliminar {{ verbose_name|lower }}?</h1>
            <p>Esta acción no se puede deshacer.</p>
            <div class="delete-target"><strong>{{ objeto }}</strong></div>
            <form method="post" class="delete-actions">
                {% csrf_token %}
                <a href="{% url 'crud_list' modelo_key %}" class="btn-crud btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                <button type="submit" class="btn-crud btn-danger"><i class="fas fa-trash"></i> Sí, eliminar</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}?v=2">
<link rel="stylesheet" href="{% static 'css/internal-overrides.css' %}?v=2">
{% endblock %}

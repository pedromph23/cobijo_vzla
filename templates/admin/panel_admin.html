{% load static %}
{% extends 'base.html' %}

{% block title %}Panel de Administración — CobijoVzla{% endblock %}

{% block content %}
<!-- El contenido existente del panel permanece sin cambios. -->
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}?v=2">
<link rel="stylesheet" href="{% static 'css/internal-overrides.css' %}?v=2">
{% endblock %}

{% block extra_js %}
<script>
(function () {
    'use strict';
    const mapa = document.getElementById('mapa-admin');
    const estado = document.getElementById('mapa-estado');
    if (!mapa || typeof window.CobijoMap === 'undefined') return;
    window.mapaAdmin = window.CobijoMap.create('mapa-admin');
    if (!window.mapaAdmin) {
        if (estado) {
            estado.textContent = 'Mapa no disponible';
            estado.dataset.estado = 'error';
        }
        return;
    }
})();
</script>
{% endblock %}

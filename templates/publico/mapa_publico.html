{% extends 'publico/mapa_publico_legacy.html' %}

{% block extra_js %}
    {{ block.super }}
    <script>
    (function () {
        'use strict';

        function renderizarZonasReales() {
            if (typeof L === 'undefined' || typeof mapaPrincipal === 'undefined' || !mapaPrincipal || typeof capaZonas === 'undefined' || !capaZonas) {
                return;
            }

            fetch('/api/publico/zonas-afectadas/', { cache: 'no-store' })
                .then(function (response) {
                    if (!response.ok) throw new Error('Zonas HTTP ' + response.status);
                    return response.json();
                })
                .then(function (zonas) {
                    if (!Array.isArray(zonas)) throw new Error('Respuesta de zonas inválida');

                    var contador = document.getElementById('count-zonas');
                    if (contador) contador.textContent = zonas.length;

                    capaZonas.clearLayers();

                    zonas.forEach(function (zona) {
                        if (!zona || !zona.geojson) return;

                        var geometry;
                        try {
                            geometry = typeof zona.geojson === 'string' ? JSON.parse(zona.geojson) : zona.geojson;
                        } catch (error) {
                            console.warn('[Zonas] GeoJSON inválido:', zona.id, error);
                            return;
                        }

                        var color = '#28a745';
                        if (zona.nivel_alerta === 'medio') color = '#ffc107';
                        if (zona.nivel_alerta === 'alto') color = '#dc3545';
                        if (zona.nivel_alerta === 'critico') color = '#7f1d1d';

                        var capa = L.geoJSON(geometry, {
                            style: function () {
                                return {
                                    color: color,
                                    fillColor: color,
                                    fillOpacity: 0.30,
                                    weight: 3,
                                    opacity: 0.95,
                                };
                            },
                            onEachFeature: function (_, layer) {
                                layer.on('click', function () {
                                    if (typeof mostrarInfoCard !== 'function') return;

                                    var contenido = document.createElement('div');
                                    var filas = [
                                        ['Alerta', String(zona.nivel_alerta || 'medio').toUpperCase()],
                                        ['Damnificados', String(zona.damnificados || 0)],
                                        ['Heridos', String(zona.heridos || 0)],
                                        ['Fallecidos', String(zona.fallecidos || 0)],
                                    ];

                                    filas.forEach(function (fila) {
                                        var p = document.createElement('p');
                                        var strong = document.createElement('strong');
                                        strong.textContent = fila[0] + ': ';
                                        p.append(strong, document.createTextNode(fila[1]));
                                        contenido.appendChild(p);
                                    });

                                    if (zona.descripcion) {
                                        var descripcion = document.createElement('p');
                                        descripcion.textContent = zona.descripcion;
                                        contenido.appendChild(descripcion);
                                    }

                                    mostrarInfoCard(zona.nombre || 'Zona afectada', contenido, {
                                        lat: zona.lat,
                                        lng: zona.lng,
                                        nombre: zona.nombre || 'Zona afectada',
                                    });
                                });
                            },
                        });

                        capa.addTo(capaZonas);
                    });
                })
                .catch(function (error) {
                    console.warn('[Zonas] No se pudieron renderizar las geometrías reales:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', function () {
            window.setTimeout(renderizarZonasReales, 300);
        }, { once: true });
    })();
    </script>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block title %}Mapa de Emergencias - CobijoVzla{% endblock %}

{% block content %}
<div class="map-layout">
    <aside id="sidebar" class="sidebar" aria-label="Panel de control del mapa">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <h2>Panel de Control</h2>
            </div>
            <button id="btn-close-sidebar" class="btn-close-sidebar" type="button" aria-label="Cerrar panel">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>

        <div class="sidebar-content">
            <div class="sidebar-section">
                <h3><i class="fas fa-search" aria-hidden="true"></i> Búsqueda</h3>
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search search-icon" aria-hidden="true"></i>
                        <input type="text" id="buscar" placeholder="Estado, parroquia, refugio..." class="form-control" autocomplete="off" aria-label="Buscar en el mapa">
                        <button id="btn-limpiar-busqueda" class="btn-clear-search" type="button" style="display:none;" aria-label="Limpiar búsqueda">
                            <i class="fas fa-times" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="sugerencias" class="sugerencias-lista"></div>
                </div>
            </div>

            <div class="sidebar-section">
                <button id="btn-geolocalizar" class="btn-location btn-block" type="button">
                    <i class="fas fa-location-arrow" aria-hidden="true"></i> Usar mi ubicación actual
                </button>
            </div>

            <div class="sidebar-section">
                <h3><i class="fas fa-layer-group" aria-hidden="true"></i> Capas del Mapa</h3>
                <label class="layer-toggle">
                    <input type="checkbox" id="chk-refugios" checked>
                    <span class="layer-icon" style="background:#0066cc;"><i class="fas fa-home" aria-hidden="true"></i></span>
                    <span class="layer-text">Refugios</span>
                    <span class="layer-badge" id="count-refugios">0</span>
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="chk-zonas" checked>
                    <span class="layer-icon" style="background:#dc3545;"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i></span>
                    <span class="layer-text">Zonas Afectadas</span>
                    <span class="layer-badge" id="count-zonas">0</span>
                </label>
                <label class="layer-toggle">
                    <input type="checkbox" id="chk-calor">
                    <span class="layer-icon" style="background:#ff6600;"><i class="fas fa-fire" aria-hidden="true"></i></span>
                    <span class="layer-text">Mapa de Calor</span>
                </label>
            </div>

            <div class="sidebar-section" id="nav-controls" style="display:none;">
                <h3><i class="fas fa-route" aria-hidden="true"></i> Navegación</h3>
                <button id="btn-toggle-panel-ruta" class="btn-nav btn-block" type="button">
                    <i class="fas fa-list-ul" aria-hidden="true"></i> Ocultar instrucciones
                </button>
                <button id="btn-toggle-voz" class="btn-nav btn-block" type="button">
                    <i class="fas fa-volume-up" aria-hidden="true"></i> <span id="txt-voz">Voz: Activada</span>
                </button>
                <button id="btn-cancelar-ruta" class="btn-nav btn-nav-danger btn-block" type="button">
                    <i class="fas fa-times-circle" aria-hidden="true"></i> Detener navegación
                </button>
            </div>

            <div class="sidebar-section">
                <a href="{% url 'reporte_ciudadano' %}" class="btn-reporte btn-block">
                    <i class="fas fa-exclamation-triangle" aria-hidden="true"></i> Reportar Emergencia
                </a>
            </div>
        </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <section class="map-main-container" aria-label="Mapa interactivo">
        <div id="map" class="main-map"></div>
    </section>
</div>
{% endblock %}
